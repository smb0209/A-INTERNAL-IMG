# .221 (a-search 박스) nginx 에 얹는 vhost — /etc/nginx/conf.d/tv.amartyyc.com.conf
# 매장 TV(MSX) 사이니지: tv.amartyyc.com/<채널> -> mini0003(.222):8080 a-signage.
# pop/instacart vhost 와 다른 점 (TV 때문):
#  - 80 도 https 로 돌리지 않고 그대로 프록시한다. MSX 는 주소에 http:// 를 붙이고, 오래된 TV 는 https 가 안 될 수 있다.
#    서버는 X-Forwarded-Proto 로 TV 가 들어온 쪽(http/https) 주소를 낸다.
#  - X-Frame-Options 를 안 붙인다. MSX 가 슬라이드쇼 플러그인을 iframe 으로 연다.
#  - HSTS 를 안 붙인다 (http 유지).
# 이 파일은 .221 박스 사본 그대로다. 맨 아래 `# managed by Certbot` 줄들은 2026-10-13
# `sudo certbot --nginx -d tv.amartyyc.com --no-redirect` 가 덧붙인 것이다. 인증서가 없는 새 박스라면 그 줄들을 빼고 올린 뒤 certbot 을 돌린다.
# 박스 공통 설정(00-default-deny 444, fail2ban, certbot 갱신)은 ~/a-search 리포 몫이다. 여기는 limit_req 를 안 써서
# fail2ban nginx-limit-req 에 매장 IP 가 밴될 일이 없고, 로그를 tv.access.log 로 나눠 a-search 접속 감시(access.log)에 섞이지 않는다.
# zone 이름은 http 컨텍스트 전역이라 다른 vhost 와 겹치지 않게 tv_* 로 둔다.
limit_conn_zone $binary_remote_addr zone=tv_conn:10m;

server {
    listen 80; listen [::]:80;
    server_name tv.amartyyc.com;
    access_log /var/log/nginx/tv.access.log;
    limit_conn tv_conn 50;          # 한 매장 TV 들은 공인 IP 하나를 같이 쓴다
    client_max_body_size 1k;        # GET/HEAD 만 쓴다

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s; proxy_send_timeout 60s; proxy_read_timeout 60s;
    proxy_buffering off;            # 영상은 TV 가 받는 만큼만 흘린다 (.221 디스크에 임시 파일 안 쌓이게)

    location /.well-known/acme-challenge/ { root /var/www/html; access_log off; }
    location / { proxy_pass http://192.168.22.222:8080; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tv.amartyyc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tv.amartyyc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
